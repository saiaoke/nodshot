name: NodShot
options:
  bundleIdPrefix: com.nodshot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  NodShot:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nodshot.app
        PRODUCT_NAME: NodShot
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO

schemes:
  NodShot:
    build:
      targets:
        NodShot: all
    run:
      config: Debug
    archive:
      config: Release
